Changes for variantcomp (MIT, see the LICENSE file of the pipeline):
- igv.js is inlined by bin/igv_inputs.py template (the CDN script line below is replaced), so
  the report works offline;
- deep link: the page opens the row whose variant_id equals the URL fragment
  (#<variant_id>), also when the fragment changes; clicking a row writes its variant_id into
  the fragment, so the address can be copied;

  that rows can also be selected from code;
- the page title is shown as a heading.
The placeholders TABLE_JSON and SESSION_DICTIONARY (in quotes and at-signs, in the script
below) are filled by create_report; they must not occur in this comment.

<html>
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
    <meta http-equiv="Pragma" content="no-cache"/>
    <meta http-equiv="Expires" content="0"/>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>IGV Variant Inspector </title>

    <!-- igv -->
    <script src="https://cdn.jsdelivr.net/npm/igv@3.5.2/dist/igv.min.js"></script>

    <style type="text/css">
        body {
            font-size: 80%;
            font-family: 'Lucida Grande', Verdana, Arial, Sans-Serif;
        }


    </style>

    <!-- selector table style -->
    <style>

        thead {
            position: sticky;
            top: 0;
        }

        tr {
            cursor: default;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: lightblue;
        }

        th {
            background-color: lightskyblue;
            color: white;
            cursor: pointer;
        }

        .selected {
            background-color: lightblue !important;
            outline: solid thin darkblue !important;
        }
    </style>

    <!-- accordian style,  ref: https://alligator.io/css/collapsible/ -->
    <style type="text/css">
        .wrap-collabsible {
            margin-bottom: 1.2rem;
        }

        input[type='checkbox'] {
            display: none;
        }

        .lbl-toggle {
            display: block;

            font-weight: bold;
            font-family: monospace;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-align: left;

            padding: 1rem;

            color: black;
            background: #dddddd;

            cursor: pointer;

            border-radius: 7px;
            transition: all 0.25s ease-out;
        }

        .lbl-toggle:hover {
            color: blue;
        }

        .lbl-toggle::before {
            content: ' ';
            display: inline-block;

            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 5px solid currentColor;
            vertical-align: middle;
            margin-right: .7rem;
            transform: translateY(-2px);

            transition: transform .2s ease-out;
        }

        .toggle:checked + .lbl-toggle::before {
            transform: rotate(90deg) translateX(-3px);
        }

        .collapsible-content {
            max-height: 0px;
            overflow: auto;
            transition: max-height .25s ease-in-out;
        }

        .toggle:checked + .lbl-toggle + .collapsible-content {
            max-height: 350px;
        }

        .toggle:checked + .lbl-toggle {
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .collapsible-content .content-inner {
            background: rgba(250, 224, 66, .2);
            border-bottom: 1px solid rgba(250, 224, 66, .45);
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
            padding: .5rem 1rem;
        }
    </style>

</head>

<body>


<!-- the page title (create_report --title) as a heading, filled from document.title -->
<h3 id="pageTitle"></h3>

<div id="container" style="display: flex; flex-direction: column">
    <div id="tableContainer" class="wrap-collabsible">
        <input id="collapsible" class="toggle" type="checkbox" checked>
        <label for="collapsible" class="lbl-toggle">Variants</label>
        <div class="collapsible-content">
            <div id="tableSelectorDiv"></div>
        </div>
    </div>

    <div id="igvContainer">
        <div id="igvDiv"></div>
    </div>
</div>

<!--
Remove igv.js script tag in header and uncomment for local debugging.  "igv.js" is the root directory of a  local
igv.js repository.  Adjust path as neccessary


<script type="module">
      import igv from "./igv.js/js/index.js";
-->

<script type="text/javascript">

    const tableJson = "@TABLE_JSON@"
    const sessionDictionary = "@SESSION_DICTIONARY@"
    let igvBrowser

    document.addEventListener("DOMContentLoaded", function () {
        initIGV()
    })


    /**
     * Create the igv instance initialized with the first session in the session dictionary.  This will correspond
     * to the first variant in the variant table. *
     */
    function initIGV() {

        const igvDiv = document.getElementById("igvDiv")
        const options =
            {
                sessionURL: sessionDictionary["0"],
                showChromosomeWidget: false,  // The session for each variant contains data and sequence for that variant only
                showCenterGuide: true,
                search: false     // disable webservice search
            }

        // show the page title (create_report --title) as a heading
        document.getElementById("pageTitle").textContent = document.title

        igv.createBrowser(igvDiv, options)
            .then(function (b) {
                igvBrowser = b
                initTable()
                // deep link: open the row of the variant in the URL fragment, now and
                // whenever the fragment changes (e.g. a link within the page)
                selectFromHash()
                window.addEventListener("hashchange", selectFromHash)
            })
    }

    /**
     * Select the row whose variant_id cell equals the URL fragment (#<variant_id>, URL-encoded
     * by the browser, e.g. '>' as %3E) and scroll it into view. Nothing happens without a
     * fragment, without a variant_id column or if no row has this variant_id.
     */
    function selectFromHash() {
        // the fragment without '#', decoded
        let id
        try {
            id = decodeURIComponent(window.location.hash.replace(/^#/, ""))
        } catch (e) {
            id = window.location.hash.replace(/^#/, "")
        }
        if (!id) return
        // column of variant_id in the displayed table (the first header, unique_id, is not shown)
        const col = tableJson.headers.indexOf("variant_id") - 1
        if (col < 0) return
        const rows = document.getElementById("variant_table").getElementsByTagName("tbody")[0].rows
        for (let i = 0; i < rows.length; i++) {
            // textContent: the cell text without HTML escaping ('&gt;' is shown as '>')
            if (rows[i].cells[col].textContent === id) {
                selectRow(rows[i], false)
                rows[i].scrollIntoView({block: "center"})
                return
            }
        }
    }

    /**
     * Select a row: highlight it, load the igv.js session of its site and (if updateHash)
     * write its variant_id into the URL fragment without adding a history entry.
     */
    function selectRow(row, updateHash) {
        // only one row is highlighted
        const list = document.getElementById("variant_table").getElementsByTagName("tr")
        for (let i = 0; i < list.length; i++) {
            list[i].classList.remove("selected")
        }
        row.classList.add("selected")
        // row ids are "row_<unique_id>"; the session dictionary is keyed by unique_id
        const uniqueId = row.id.substring(4)
        igvBrowser.loadSession({
            url: sessionDictionary[uniqueId]
        })
        if (updateHash) {
            const col = tableJson.headers.indexOf("variant_id") - 1
            if (col >= 0) {
                // replaceState: copyable address, but the back button does not step through rows
                history.replaceState(null, "", "#" + encodeURIComponent(row.cells[col].textContent))
            }
        }
    }

    function initTable() {

        // table
        const table = document.createElement("table")
        table.id = "variant_table"
        table.style.width = "100%"
        document.getElementById("tableSelectorDiv").appendChild(table)

        // header
        const thead = document.createElement('thead')
        table.appendChild(thead)
        const headerRow = thead.insertRow(0)
        const headers = tableJson.headers
        for (let j = 1; j < headers.length; j++) {
            var cell = document.createElement("th")
            headerRow.appendChild(cell)
            cell.innerHTML = headers[j]
        }


        // body
        const tbody = document.createElement('tbody')
        table.appendChild(tbody)
        const tableRows = tableJson.rows
        for (let i = 0; i < tableRows.length; i++) {

            const rowData = tableRows[i]
            const unique_id = rowData[0]
            const row = document.createElement("tr")
            row.id = "row_" + unique_id
            tbody.appendChild(row)

            // First row selected by default
            if (i === 0) row.classList.add("selected")

            // a click selects this row (the row itself, not the parent of the clicked
            // element) and writes its variant_id into the URL fragment
            row.onclick = function () {
                selectRow(row, true)
            }

            for (let j = 1; j < headers.length; j++) {
                cell = document.createElement("td")
                //cell.rowID = i;
                row.appendChild(cell)
                cell.innerHTML = rowData[j]
            }
        }

        // Add sorting.  Adapted from https://stackoverflow.com/questions/14267781/sorting-html-table-with-javascript/49041392
        Array.prototype.slice.call(document.querySelectorAll('th')).forEach(function (th) {
            th.addEventListener('click', function () {
                //var table = th.parentNode
                //while (table.tagName.toUpperCase() != 'TABLE') table = table.parentNode;
                Array.prototype.slice.call(table.querySelectorAll('tr:nth-child(n+1)'), 1)
                    .sort(comparer(Array.prototype.slice.call(th.parentNode.children).indexOf(th), this.asc = !this.asc))
                    .forEach(function (tr) {
                        table.appendChild(tr)
                    })
            })
        })


        function getCellValue(tr, idx) {
            return tr.children[idx].innerText || tr.children[idx].textContent
        }

        function comparer(idx, asc) {
            return function (a, b) {
                return function (v1, v2, asc) {
                    // Special case for chromosome coloumn
                    if (idx === 0 && v1.startsWith('chr') && v2.startsWith('chr')) {
                        v1 = v1.substr(3)
                        v2 = v2.substr(3)
                    }
                    // always put empty columns at end of table when sorting            
                    if (v1 == '' && v2 != '') {
                        return 1
                    }
                    if (v2 == '' && v1 != '') {
                        return -1
                    }

                    var isNumber = v1 !== '' && v2 !== '' && !isNaN(v1) && !isNaN(v2)
                    ret = isNumber ? v1 - v2 : v1.toString().localeCompare(v2)

                    // reverse ordering if not ascending order            
                    if (!asc) {
                        ret = -1 * ret
                    }
                    return (ret)

                }(getCellValue(a, idx), getCellValue(b, idx), asc)
            }
        }

    }


</script>
</body>
</html>
