# MultiQC configuration of the variantcomp report (decision D37): the MultiQC report is the
# main report of a run. The variantcomp sections (bin/report_content.py, ids vc_*) come
# first, ordered by importance; the QC sections of the steps and tools follow; methods and
# software versions close the report.
title: "Somatic variant comparison between sequencing technologies"
subtitle: "core-unit-bioinformatics/workflow-nxf-somatic-variantcomp"
intro_text: >
  Comparison of the somatic SNV and indel calls of the same tumor/normal pairs sequenced with
  different technologies, in six chapters: 1 the summary of the results, 2 the validation
  with known variants, 3 the discordant variants and why they differ, 4 the filtering of the
  input variants, 5 the compared region and the coverage, 6 the methods and quality control.
  Every chapter starts with an introduction. All variant tables are in the linked table
  browser (datavzrd).
report_comment: >
  This report has been generated by the <a href="https://github.com/core-unit-bioinformatics/workflow-nxf-somatic-variantcomp/tree/dev" target="_blank">core-unit-bioinformatics/workflow-nxf-somatic-variantcomp</a>
  analysis pipeline. Variant tables: <a href="../report/tables/index.html" target="_blank">table browser (datavzrd)</a>.
# fixed output names (a title would otherwise rename them): the datavzrd tables and the
# report bundle link to multiqc/multiqc_report.html
output_fn_name: "multiqc_report.html"
data_dir_name: "multiqc_data"
plots_dir_name: "multiqc_plots"
show_analysis_paths: false
# the General Statistics table is always rendered above every section; the coverage it
# would show is in the section Coverage
skip_generalstats: true

# The report reads like a book (decision D39): six numbered chapters. The variantcomp
# sections (bin/report_content.py) are grouped into one MultiQC module per chapter
# (vc_ch_<chapter>, with an introduction); the tool modules, the step tables, the methods
# description, the software versions and the workflow summary can't be nested, so they get
# the number of their chapter here and follow it (higher order = earlier). Their anchors
# are listed in TOOL_MODULES of report_content.py, which styles them as sections.
report_section_order:
  vc_ch_summary:
    order: 2000
  vc_ch_known:
    order: 1990
  vc_ch_discordance:
    order: 1980
  vc_ch_filtering:
    order: 1970
  variantcomp_normalization:
    order: 1969
  variantcomp_harmonization:
    order: 1968
  vep:
    order: 1967
  vc_ch_regions:
    order: 1960
  mosdepth:
    order: 1959
  vc_ch_methods:
    order: 1950
  variantcomp_input_checks:
    order: 1949
  "core-unit-bioinformatics-workflow-nxf-somatic-variantcomp-methods-description":
    order: 1948
  multiqc_software_versions:
    order: 1947
  # nf-core lint wants the template keys with negative orders, the workflow summary last;
  # MultiQC orders the versions module by its anchor multiqc_software_versions (above)
  software_versions:
    order: -1001
  "core-unit-bioinformatics-workflow-nxf-somatic-variantcomp-summary":
    order: -1002

# names and introductions of the tool modules (all other modules still run); the software
# versions module has a fixed name, report_content.py (JS_LIB) renames it to 6.4
module_order:
  - vep:
      name: "4.4 Variant annotation (Ensembl VEP)"
      info: >
        **What is shown:** the annotation of the compared variants of every VCF by Ensembl
        VEP (offline cache or GTF): variant classes, consequences, impact, the position in
        the protein and the variants per chromosome. The genes, HGVS notations and
        consequences of the variant tables come from this annotation.
  - mosdepth:
      name: "5.3 Depth distributions (mosdepth)"
      info: >
        **What is shown:** the depth distribution of every alignment in the target region of
        its technology: the share of bases with at least a given depth (cumulative), and the
        mean depth per contig. Steep curves mean even coverage; the callable regions (5.1) use
        the depth thresholds of `--min_coverage_tumor` and `--min_coverage_normal`.

# names and descriptions of the step tables (bin/mqc_tables.py) and of the methods and
# workflow summary sections (custom content written by the pipeline)
custom_data:
  variantcomp_normalization:
    section_name: "4.2 Normalization per VCF (bcftools norm)"
    description: >
      **What is shown:** the counts of `bcftools norm` for every VCF and branch (pass: the
      compared PASS calls; non_pass: the other calls, kept to explain discordant variants):
      records read (total), multiallelic records split, records left-aligned
      (realigned), records removed because their REF differs from the FASTA
      (mismatch_removed) or as duplicates (dup_removed). The funnel of 4.1 sums them up.
  variantcomp_harmonization:
    section_name: "4.3 Harmonization per VCF (VAF, depth, alt reads)"
    description: >
      **What is shown:** for every VCF and branch, where the VAF, depth and alt-read counts
      come from (FORMAT/AF or AD, `--vaf_source`), how many records lacked a value, and how
      many records with symbolic or '*' alleles were removed. One source per VCF makes the
      uniform filters comparable between the callers.
  variantcomp_input_checks:
    section_name: "6.2 Input checks"
    description: >
      **What is shown:** the reference check of every input at the start of the run: status,
      contigs renamed (chr/no-chr, MT/chrM) or dropped (chrM unless `--keep_mito`),
      contig-length and genome-build checks, and the rate of REF alleles that differ from
      the FASTA. Errors stop the run before any other step.
  "core-unit-bioinformatics-workflow-nxf-somatic-variantcomp-methods-description":
    section_name: "6.3 Methods description"
  "core-unit-bioinformatics-workflow-nxf-somatic-variantcomp-summary":
    section_name: "6.5 Workflow summary"

export_plots: true

disable_version_detection: true
