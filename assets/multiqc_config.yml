# MultiQC configuration of the variantcomp report (decision D37): the MultiQC report is the
# main report of a run. The variantcomp sections (bin/report_content.py, ids vc_*) come
# first, ordered by importance; the QC sections of the steps and tools follow; methods and
# software versions close the report.
title: "Somatic variant comparison between sequencing technologies"
subtitle: "core-unit-bioinformatics/workflow-nxf-somatic-variantcomp"
intro_text: >
  Comparison of the somatic SNV and indel calls of the same tumor/normal pairs sequenced with
  different technologies. The report starts with the summary and the main results; the
  details and the quality control of every step follow below. All variant tables are in the
  linked table browser (datavzrd).
report_comment: >
  This report has been generated by the <a href="https://github.com/core-unit-bioinformatics/workflow-nxf-somatic-variantcomp/tree/dev" target="_blank">core-unit-bioinformatics/workflow-nxf-somatic-variantcomp</a>
  analysis pipeline. Variant tables: <a href="../report/tables/index.html" target="_blank">table browser (datavzrd)</a>.
# fixed output names (a title would otherwise rename them): the datavzrd tables and the
# report bundle link to multiqc/multiqc_report.html
output_fn_name: "multiqc_report.html"
data_dir_name: "multiqc_data"
plots_dir_name: "multiqc_plots"
show_analysis_paths: false
# the General Statistics table is always rendered above every section; the coverage it
# would show is in the section Coverage
skip_generalstats: true

report_section_order:
  # main results
  vc_summary:
    order: 2000
  vc_introduction:
    order: 1990
  vc_recall_precision:
    order: 1980
  vc_overlap:
    order: 1975
  vc_truth_found:
    order: 1970
  vc_known:
    order: 1960
  vc_why:
    order: 1950
  vc_characterization:
    order: 1940
  # details
  vc_metrics:
    order: 1930
  vc_metrics_table:
    order: 1925
  vc_regions:
    order: 1920
  vc_filtering:
    order: 1910
  vc_coverage:
    order: 1900
  # quality control of the steps (input checks, normalization, harmonization, then the
  # tool modules mosdepth and VEP)
  variantcomp_input_checks:
    order: 900
  variantcomp_normalization:
    order: 890
  variantcomp_harmonization:
    order: 880
  vc_checks:
    order: 860
  "core-unit-bioinformatics-workflow-nxf-somatic-variantcomp-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "core-unit-bioinformatics-workflow-nxf-somatic-variantcomp-summary":
    order: -1002

export_plots: true

disable_version_detection: true
