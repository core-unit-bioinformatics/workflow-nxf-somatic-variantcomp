[project]
name = "workflow-nxf-somatic-variantcomp"
version = "0.15.0-dev"
description = "Compare somatic variant calls of the same tumor/normal pairs across sequencing technologies (WGS, WES, panel)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kai Horny" }]
requires-python = ">=3.10"

[project.urls]
repository = "https://github.com/core-unit-bioinformatics/workflow-nxf-somatic-variantcomp"

[tool.black]
# black formats all Python code; ruff only lints (no formatting rules)
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# line length is handled by black; long message strings can't be wrapped by it
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

