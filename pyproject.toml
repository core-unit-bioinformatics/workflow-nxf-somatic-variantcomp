[project]
name = "workflow-nxf-somatic-variantcomp"
version = "0.10.0-dev"
description = "Compare somatic variant calls of the same tumor/normal pairs across sequencing technologies (WGS, WES, panel)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Kai Horny" }]
requires-python = ">=3.10"

[project.urls]
repository = "https://github.com/core-unit-bioinformatics/workflow-nxf-somatic-variantcomp"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff.lint.per-file-ignores]
# long VCF header lines in test-data generators
"tests/synthetic/make_synthetic_data.py" = ["E501"]
