name: variantcomp-dev
channels:
  - conda-forge
  - bioconda
dependencies:
  # workflow engine and nf-core tooling
  - nextflow=26.04.4
  - nf-core=4.1.0
  - nf-test
  # fast conda-env activation in nf-tests (tests/nextflow.config: conda.useMicromamba)
  - micromamba
  # python for bin/ scripts and test-data preparation
  - python=3.12
  - pysam
  - pandas
  - scipy>=1.11  # scipy.stats.false_discovery_control
  - matplotlib
  - upsetplot
  - pyyaml
  - requests
  - pytest
  - ruff
  # formatter of all Python code (bin/, scripts/, tests/)
  - black
  # docs: PNG rendering of the metro map (scripts/make_metro_map.py)
  - cairosvg
  # bioinformatics tools (all have linux-aarch64 or noarch builds)
  - bcftools=1.24
  - samtools=1.24
  - htslib=1.24
  - bedtools=2.31.1
  - mosdepth=0.3.14
  - rtg-tools=3.13
